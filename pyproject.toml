[project]
name = "plugins-repo-dev"
version = "0.1.0"
description = "Development tooling for the Agent Plugins collection in this repository. Not published or shipped with any plugin."
requires-python = ">=3.11"

# This repo is a uv workspace: each MCP server under `*/servers/*` is its own
# package with its own dependencies, resolved together into one root uv.lock
# so container builds are reproducible. See AGENTS.md.
[tool.uv.workspace]
members = ["*/servers/*"]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "ty>=0.0.75",
  "taplo>=0.9",
  "typos>=1.30",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "inline-snapshot>=0.20",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "fastmcp>=3.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "W",     # pycodestyle
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # bugbear
  "SIM",   # simplify
  "N",     # pep8-naming
  "D",     # pydocstyle
  "S",     # bandit (security)
  "ASYNC", # async correctness
  "C4",    # comprehensions
  "PIE",   # misc lints
  "PT",    # pytest style
  "RET",   # return simplification
  "PTH",   # prefer pathlib
  "ARG",   # unused arguments
  "TC",    # type-checking imports
  "ISC",   # implicit str concat
  "RUF",   # ruff-specific (includes RUF100 unused-noqa)
]
ignore = [
  "D203", # conflicts with D211 (no blank line before class docstring)
  "D213", # conflicts with D212 (multi-line summary on first line)
  "D107", # __init__ docstring; the class docstring covers it
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point, docstrings on every test add noise, and
# runtime imports of Path/pytest read better than TYPE_CHECKING blocks.
"tests/**" = ["S101", "D100", "D103", "TC001", "TC002", "TC003"]
"*/servers/*/tests/**" = ["S101", "D100", "D103", "TC001", "TC002", "TC003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
# PEP 723 single-file scripts (skills/*/scripts/, servers/) declare their own
# dependencies inline and are type-checked via `uv run --script` (see
# AGENTS.md), not this repo-wide environment, so they are excluded here to
# avoid false import errors.
exclude = ["**/skills/*/scripts/", "**/servers/"]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename} -"

[tool.pytest.ini_options]
testpaths = ["tests", "*/servers/*/tests"]
# `auto` means async test functions need no per-test decorator, so server
# tests stay boilerplate-free.
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  # importlib import mode lets every server use the same tests/test_server.py
  # basename without module-name collisions, and needs no __init__.py files.
  "--import-mode=importlib",
]
# Makes tests/discovery.py importable regardless of import mode.
pythonpath = ["tests"]
xfail_strict = true
filterwarnings = [
  "error",
  # FastMCP/uvicorn emit deprecation chatter from transitive deps we don't control.
  "default::DeprecationWarning",
]
markers = [
  "slow: exercises a real subprocess or network round trip (deselect with -m 'not slow')",
]
