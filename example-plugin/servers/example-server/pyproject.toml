[project]
name = "example-server"
version = "0.1.0"
description = "Example FastMCP server for the example-plugin Agent Plugin."
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.4",
]

[project.scripts]
example-server = "example_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_server"]
