# Pre-commit hooks for this repo. Install/run via `uv`'s ad hoc tool runner
# (not pip):
#
#   just install-hooks        # or: uvx pre-commit install
#   just pre-commit-all       # or: uvx pre-commit run --all-files
#
# The file-hygiene hooks below run in pre-commit's own isolated environments
# (how the framework always manages third-party hooks). The ruff/ty/typos/
# taplo/pytest/trivy hooks are `language: system` and call straight through to
# this repo's own uv- and trivy-managed tooling, so they stay in lockstep with
# the justfile instead of pinning a second copy of the same tools.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-executables-have-shebangs
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: taplo
        name: taplo fmt (TOML)
        entry: uv run taplo fmt
        language: system
        types: [toml]

      - id: typos
        name: typos (spell check)
        entry: uv run typos
        language: system
        pass_filenames: false

      - id: ty
        name: ty check
        entry: uv run ty check .
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-fast
        name: pytest (fast tests only)
        entry: uv run pytest -m "not slow"
        language: system
        types: [python]
        pass_filenames: false

      - id: trivy
        name: trivy security scan
        entry: trivy fs --config trivy.yaml .
        language: system
        pass_filenames: false
        always_run: true
