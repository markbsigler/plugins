# Pre-commit hooks for this repo. Install/run via `uv`'s ad hoc tool runner
# (not pip):
#
#   uvx pre-commit install          # install the git hook once
#   uvx pre-commit run --all-files  # run every hook against the whole repo
#
# `pre-commit` manages the small file-hygiene hooks below in its own
# isolated environments (how the pre-commit framework always works). The
# `ruff`/`ty`/`pytest`/`trivy` hooks instead call straight through to this
# repo's own `uv`- and `trivy`-managed tooling (`language: system`), so they
# stay in lockstep with `justfile` and AGENTS.md rather than a second,
# separately pinned copy of the same tools.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json
        exclude: ^\.vscode/

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ty
        name: ty check
        entry: uv run ty check .
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-fast
        name: pytest (fast tests only)
        entry: uv run pytest -m "not slow"
        language: system
        types: [python]
        pass_filenames: false

      - id: trivy
        name: trivy security scan
        entry: trivy fs --config trivy.yaml .
        language: system
        pass_filenames: false
        always_run: true
